# Builds, tests and packs Orbit for Windows (docs/plan/01-stack.md: .NET 10, WPF, Velopack).
# The installer is unsigned until a code-signing certificate exists (docs/plan/01-stack.md,
# "Signing"); vpk then signs with --signParams or --azureTrustedSignFile.
name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Swift, for the typing engine.
      - uses: compnerd/gha-setup-swift@57fe462cd3c7b05ae8fcff79b00719312e305257 # main on 2026-11-06
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - name: Typing engine
        shell: pwsh
        run: tools/typing-engine/build.ps1
      - name: Version
        id: version
        shell: pwsh
        run: |
          # A v<version> tag names the release; anything else is 0.1.<run number>.
          $version = if ("${{ github.ref }}" -like "refs/tags/v*") { "${{ github.ref_name }}".Substring(1) } else { "0.1.${{ github.run_number }}" }
          "ORBIT_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build
        run: dotnet build Orbit.slnx -c Release -p:Version=${{ env.ORBIT_VERSION }} -p:UpdateRepo=https://github.com/${{ github.repository }}
      - name: Test
        run: dotnet test tests/Orbit.Tests -c Release --no-build
      - name: Publish
        run: dotnet publish src/Orbit.App -c Release -o artifacts/publish -p:Version=${{ env.ORBIT_VERSION }} -p:UpdateRepo=https://github.com/${{ github.repository }}
      - name: Pack
        run: |
          dotnet tool restore
          dotnet vpk pack --packId OrbitWindows --packVersion ${{ env.ORBIT_VERSION }} --packDir artifacts/publish --icon src/Orbit.App/Assets/Orbit.ico --mainExe Orbit.exe --packTitle Orbit --packAuthors useemeonascreen --framework net10.0-x64-desktop --outputDir artifacts/releases
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-${{ env.ORBIT_VERSION }}
          path: artifacts/releases

  # Only a v<version> tag becomes a release, so other builds never reach the update feed. The only
  # job that may write: it runs nothing from the repository but its pinned vpk tool.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: Orbit-${{ needs.build.outputs.version }}
          path: artifacts/releases
      - name: Publish release
        run: |
          dotnet tool restore
          dotnet vpk upload github --outputDir artifacts/releases --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --releaseName "Orbit ${{ needs.build.outputs.version }}" --tag ${{ github.ref_name }} --publish
